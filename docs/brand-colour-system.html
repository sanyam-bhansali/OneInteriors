document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 url(\"75b8274e-acae-4cc2-b23a-3272765f5e79\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;background:#EAE6DF}\n  a{color:#A94F2E;text-decoration:none;border-bottom:1px solid rgba(169,79,46,.3)}\n  a:hover{color:#8F4126}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--bg:#EAE6DF;--card:#FCFCFA;--ink:#2C2624;--ink2:#6B615C;--ink3:#9A8F86;--acc:#C0613C;--accd:#A94F2E;--sec:#839073;--secd:#5F6B52;--line:#DBD5CB;background:var(--bg);color:var(--ink);font-family:'Quicksand',sans-serif;min-height:100vh\">\n\n<header style=\"padding:clamp(48px,7vw,88px) clamp(24px,5vw,72px) clamp(32px,4vw,52px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accd)\">One Interiors · Brand colour system<\u002Fp>\n    <h1 style=\"margin:0 0 20px;font-family:'Instrument Serif',serif;font-size:clamp(36px,5.5vw,64px);line-height:1.04;letter-spacing:-.015em;max-width:15ch;text-wrap:pretty\">Tactile Assurance<\u002Fh1>\n    <p style=\"margin:0;font-size:18px;line-height:1.62;color:var(--ink2);max-width:620px\">One palette across everything we make — marketing site, the app, the studio software, quote documents, email. Five colours carry meaning; the rest are the surfaces and inks that let them work.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 28px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">01 · The five that carry meaning<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px\">\n\n      <div style=\"background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column\">\n        <div style=\"height:132px;background:#EAE6DF;border-bottom:1px solid var(--line)\"><\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n          <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px\">Raw Silk<\u002Fp>\n          <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#EAE6DF · --bg<\u002Fp>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)\">The foundation. Every page ground. Warm, tactile, lowers the heart rate — never a cool web grey.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column\">\n        <div style=\"height:132px;background:#FCFCFA;border-bottom:1px solid var(--line)\"><\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n          <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px\">Alabaster<\u002Fp>\n          <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#FCFCFA · --card<\u002Fp>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)\">The canvas. Cards, comparison tables, quote documents. Softer than white so dense reading does not strain.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column\">\n        <div style=\"height:132px;background:#2C2624;border-bottom:1px solid var(--line)\"><\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n          <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px\">Deep Espresso<\u002Fp>\n          <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#2C2624 · --ink<\u002Fp>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)\">The trust anchor. All primary type, and dark sections. A brown-black reads permanent where pure black reads clinical.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column\">\n        <div style=\"height:132px;background:#C0613C;border-bottom:1px solid var(--line)\"><\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n          <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px\">Terracotta<\u002Fp>\n          <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#C0613C · --acc<\u002Fp>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)\">The spark. High-intent actions, and flags pointing at a gap. Urgent without the alarm of red.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column\">\n        <div style=\"height:132px;background:#839073;border-bottom:1px solid var(--line)\"><\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n          <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px\">Muted Sage<\u002Fp>\n          <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#839073 · --sec<\u002Fp>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)\">Verification. Checks cleared, match scores, the better spec of two. A green light, not a gamified badge.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:var(--card);padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(28px,4vw,56px)\">\n\n    <div>\n      <p style=\"margin:0 0 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">02 · Ink scale<\u002Fp>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#2C2624;flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Primary<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Headings, body, numbers<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#2C2624<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#6B615C;flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Secondary<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Supporting copy, captions<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#6B615C<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#9A8F86;flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Tertiary<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Mono labels on glass only<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#9A8F86<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#B8AEA6;flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Disabled<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Inert controls, never text<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#B8AEA6<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"margin:0 0 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">03 · Surface scale<\u002Fp>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#EAE6DF;border:1px solid var(--line);flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Ground<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Page background<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#EAE6DF<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#FCFCFA;border:1px solid var(--line);flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Raised<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Cards, tables, documents<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#FCFCFA<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#EFEAE1;border:1px solid var(--line);flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Sunken<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Inputs, incoming messages<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#EFEAE1<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)\"><span style=\"width:40px;height:40px;background:#DBD5CB;flex-shrink:0\"><\u002Fspan><div style=\"flex:1;min-width:0\"><p style=\"margin:0;font-size:15px;font-weight:600\">Hairline<\u002Fp><p style=\"margin:2px 0 0;font-size:13.5px;color:var(--ink2)\">Every rule and border<\u002Fp><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)\">#DBD5CB<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#2C2624;color:#F6F1E8;padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#E0A98C\">04 · On dark<\u002Fp>\n    <h2 style=\"margin:0 0 28px;font-family:'Instrument Serif',serif;font-size:clamp(26px,3.2vw,38px);line-height:1.1;letter-spacing:-.015em;max-width:22ch;text-wrap:pretty\">Espresso sections need their own accents — the light-surface hexes go muddy.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px\">\n      <div style=\"border:1px solid rgba(252,252,250,.18);padding:18px\"><span style=\"display:block;height:52px;background:#F6F1E8;margin-bottom:14px\"><\u002Fspan><p style=\"margin:0;font-size:15px;font-weight:600\">Ink on dark<\u002Fp><p style=\"margin:4px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:rgba(252,252,250,.66)\">#F6F1E8 · 14.0:1<\u002Fp><\u002Fdiv>\n      <div style=\"border:1px solid rgba(252,252,250,.18);padding:18px\"><span style=\"display:block;height:52px;background:#E0A98C;margin-bottom:14px\"><\u002Fspan><p style=\"margin:0;font-size:15px;font-weight:600\">Terracotta on dark<\u002Fp><p style=\"margin:4px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:rgba(252,252,250,.66)\">#E0A98C · 7.3:1<\u002Fp><\u002Fdiv>\n      <div style=\"border:1px solid rgba(252,252,250,.18);padding:18px\"><span style=\"display:block;height:52px;background:#B9C4A9;margin-bottom:14px\"><\u002Fspan><p style=\"margin:0;font-size:15px;font-weight:600\">Sage on dark<\u002Fp><p style=\"margin:4px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:rgba(252,252,250,.66)\">#B9C4A9 · 8.2:1<\u002Fp><\u002Fdiv>\n      <div style=\"border:1px solid rgba(252,252,250,.18);padding:18px\"><span style=\"display:block;height:52px;background:rgba(252,252,250,.16)\"><\u002Fspan><p style=\"margin:14px 0 0;font-size:15px;font-weight:600\">Hairline on dark<\u002Fp><p style=\"margin:4px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:rgba(252,252,250,.66)\">rgba(252,252,250,.16)<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:32px;padding-top:24px;border-top:1px solid rgba(252,252,250,.18);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px\">\n      <div>\n        <p style=\"margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#E0A98C\">GLASS · WARM<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;color:rgba(252,252,250,.82)\">rgba(247,242,234,.82)<br>blur(18px) saturate(1.2)<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:14px;line-height:1.55;color:rgba(252,252,250,.7)\">Snapshot cards. Inner hairline #E2D9CB, mono labels #9A8F86.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:#E0A98C\">GLASS · DARK<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;color:rgba(252,252,250,.82)\">rgba(36,29,26,.5)<br>blur(22px) saturate(1.15)<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:14px;line-height:1.55;color:rgba(252,252,250,.7)\">Frames over photography. 26px radius, inset top highlight at 16%.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">05 · Deep variants<\u002Fp>\n    <h2 style=\"margin:0 0 14px;font-family:'Instrument Serif',serif;font-size:clamp(26px,3.2vw,38px);line-height:1.1;letter-spacing:-.015em;max-width:24ch;text-wrap:pretty\">Terracotta and Sage are surface colours. For small text they need a deeper cut.<\u002Fh2>\n    <p style=\"margin:0 0 30px;font-size:16.5px;line-height:1.6;color:var(--ink2);max-width:600px\">At mono-label sizes the base hexes land near 4:1 and 3.3:1 against Alabaster — under the 4.5:1 floor. These two exist so the meaning survives at 10px.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px\">\n      <div style=\"background:var(--card);border:1px solid var(--line);padding:22px\">\n        <div style=\"display:flex;gap:12px;margin-bottom:18px\"><span style=\"flex:1;height:60px;background:#C0613C\"><\u002Fspan><span style=\"flex:1;height:60px;background:#A94F2E\"><\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0 0 4px;font-size:15.5px;font-weight:600\">Terracotta Deep · <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:400\">#A94F2E<\u002Fspan><\u002Fp>\n        <p style=\"margin:0 0 14px;font-size:14.5px;line-height:1.55;color:var(--ink2)\">Terracotta text and mono flags on light. Also the hover state of a terracotta button. <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px\">5.2:1<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#A94F2E\">— QUANTITY NOT STATED<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);padding:22px\">\n        <div style=\"display:flex;gap:12px;margin-bottom:18px\"><span style=\"flex:1;height:60px;background:#839073\"><\u002Fspan><span style=\"flex:1;height:60px;background:#5F6B52\"><\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0 0 4px;font-size:15.5px;font-weight:600\">Sage Deep · <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:400\">#5F6B52<\u002Fspan><\u002Fp>\n        <p style=\"margin:0 0 14px;font-size:14.5px;line-height:1.55;color:var(--ink2)\">Sage text on light — \"verified\", score labels, better-spec notes. Base Sage stays for ticks and fills. <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px\">5.5:1<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#5F6B52\">— 15 OF 15 CLEARED<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:var(--card);padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">06 · System states<\u002Fp>\n    <h2 style=\"margin:0 0 14px;font-family:'Instrument Serif',serif;font-size:clamp(26px,3.2vw,38px);line-height:1.1;letter-spacing:-.015em;max-width:26ch;text-wrap:pretty\">Error is not Terracotta. Terracotta is a button.<\u002Fh2>\n    <p style=\"margin:0 0 30px;font-size:16.5px;line-height:1.6;color:var(--ink2);max-width:600px\">If the destructive colour is also the primary action colour, people hesitate over both. Three state colours sit outside the brand five — all still inside the warm family, none of them blue.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px\">\n      <div style=\"border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"height:48px;background:#8C2F22\"><\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;font-weight:600\">Error · destructive<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#8C2F22 · 8.0:1<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Failed check, cancelled booking, delete. Darker and redder than Terracotta so the two never read alike.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"height:48px;background:#8A6220\"><\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;font-weight:600\">Attention · pending<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#8A6220 · 5.8:1<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Awaiting a rate card, re-check due, quote expiring. Ochre, not yellow.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"height:48px;background:#5F6B52\"><\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;font-weight:600\">Success · cleared<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#5F6B52 · 5.5:1<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Sage Deep does this job. We do not add a second green.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"height:48px;background:#6B615C\"><\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;font-weight:600\">Information<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)\">#6B615C · 4.8:1<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Secondary ink, never a blue. A blue would be the only cool thing we own.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 28px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">07 · Contrast, measured<\u002Fp>\n    <div style=\"background:var(--card);border:1px solid var(--line)\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--ink2)\"><span>FOREGROUND<\u002Fspan><span>ON<\u002Fspan><span style=\"text-align:right\">RATIO<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>Deep Espresso<\u002Fspan><span style=\"color:var(--ink2)\">Raw Silk<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">12.0<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>Deep Espresso<\u002Fspan><span style=\"color:var(--ink2)\">Alabaster<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">14.5<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>Secondary ink<\u002Fspan><span style=\"color:var(--ink2)\">Raw Silk<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">4.8<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>Terracotta Deep<\u002Fspan><span style=\"color:var(--ink2)\">Alabaster<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">5.3<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>#FFF8F1 text<\u002Fspan><span style=\"color:var(--ink2)\">Terracotta Deep button<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">5.2<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>#FFF8F1 text<\u002Fspan><span style=\"color:var(--ink2)\">Terracotta base button<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#8C2F22\">4.0<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);font-size:14.5px\"><span>Sage base<\u002Fspan><span style=\"color:var(--ink2)\">Alabaster<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#8A6220\">3.3<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.7fr);gap:14px;padding:13px 20px;font-size:14.5px\"><span>Ink on dark<\u002Fspan><span style=\"color:var(--ink2)\">Deep Espresso<\u002Fspan><span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--secd)\">14.0<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;margin-top:18px\">\n      <p style=\"margin:0;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2)\"><span style=\"width:10px;height:10px;background:#5F6B52\"><\u002Fspan>Passes AA at any size<\u002Fp>\n      <p style=\"margin:0;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2)\"><span style=\"width:10px;height:10px;background:#8A6220\"><\u002Fspan>Graphics and icons only<\u002Fp>\n      <p style=\"margin:0;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2)\"><span style=\"width:10px;height:10px;background:#8C2F22\"><\u002Fspan>Large text only — use the deep cut below 18px<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:var(--card);padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 28px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">08 · The laws<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 clamp(28px,4vw,56px)\">\n      <div>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">01<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">One Terracotta action per view. If two things are terracotta, neither is the thing to do.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">02<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Sage is never clickable. It reports a fact that has been checked — the moment it becomes a button it stops meaning verified.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">03<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Money, quantities and specs are always IBM Plex Mono — in Espresso, never in an accent.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">04<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Maximum two background colours per screen. A third surface reads as a different product.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">05<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Squared corners everywhere except glass, which curves — 26px frames, 12–18px inside.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">06<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Type on photography sits on a veil, at full opacity. Never alpha-muted ink over an image.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">07<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">No gradients as decoration. The only gradients we own are photographic veils and one flare in the hero.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--accd);padding-top:4px\">08<\u002Fspan><p style=\"margin:0;flex:1;font-size:15.5px;line-height:1.6\">Nothing cool. No blue, no cool grey, no pure black, no pure white — anywhere, including charts.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(44px,6vw,76px) clamp(24px,5vw,72px)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <p style=\"margin:0 0 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)\">09 · Drop-in tokens<\u002Fp>\n    <div style=\"background:#2C2624;padding:clamp(20px,3vw,30px);overflow-x:auto\">\n      <pre style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.95;color:#F6F1E8\">:root {\n  --bg:      #EAE6DF;   /* Raw Silk — page ground        */\n  --card:    #FCFCFA;   /* Alabaster — raised surface    */\n  --sunken:  #EFEAE1;   /* inputs, incoming messages     */\n  --line:    #DBD5CB;   /* hairline                      */\n\n  --ink:     #2C2624;   /* Deep Espresso — primary type  */\n  --ink2:    #6B615C;   /* secondary copy, information   */\n  --ink3:    #9A8F86;   /* mono labels on glass          */\n  --ink-dis: #B8AEA6;   /* disabled controls             */\n\n  --acc:     #C0613C;   /* Terracotta — surfaces, fills  */\n  --acc-d:   #A94F2E;   /* small text, hover             */\n  --acc-p:   #8F4126;   /* pressed                       */\n  --acc-w:   rgba(192,97,60,.08);  /* active row wash    */\n\n  --sec:     #839073;   /* Muted Sage — ticks, fills     */\n  --sec-d:   #5F6B52;   /* small text, success           */\n  --sec-w:   rgba(131,144,115,.14);\n\n  --err:     #8C2F22;   /* destructive — never --acc     */\n  --warn:    #8A6220;   /* pending, expiring             */\n\n  --on-acc:  #FFF8F1;   /* type on terracotta            */\n  --on-dark: #F6F1E8;   /* type on espresso              */\n  --acc-dark:#E0A98C;   /* terracotta on espresso        */\n  --sec-dark:#B9C4A9;   /* sage on espresso              */\n  --line-dark: rgba(252,252,250,.16);\n\n  --glass-warm: rgba(247,242,234,.82);  /* blur(18px)    */\n  --glass-dark: rgba(36,29,26,.5);      /* blur(22px)    */\n  --glass-line: #E2D9CB;\n}<\u002Fpre>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0;font-size:15px;line-height:1.6;color:var(--ink2);max-width:640px\">Scope these to a class rather than <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px\">:root<\u002Fspan> if the studio software has its own tokens — the landing page already uses <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px\">.oi-landing<\u002Fspan>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>

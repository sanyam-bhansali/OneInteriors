<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opening</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button:focus-visible{outline:2px solid #ffd9a0;outline-offset:3px}
.oi-halo{position:absolute;left:50%;top:50%;width:620px;height:390px;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(242,201,138,.18),rgba(242,201,138,.05) 45%,rgba(242,201,138,0) 70%);animation:oihalo 2.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes oihalo{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.oi-logo{position:absolute;inset:0;-webkit-mask:url(/_blob/bcba52f114ab49b6deb05107a4e5f397) center/contain no-repeat;mask:url(/_blob/bcba52f114ab49b6deb05107a4e5f397) center/contain no-repeat;background:linear-gradient(105deg,#ece6da 0%,#f4f1e9 38%,#f6d9a6 46%,#fff8ec 50%,#f6d9a6 54%,#f4f1e9 62%,#ece6da 100%);background-size:320% 100%;background-position:100% 0;opacity:0;filter:blur(18px);transform:scale(1.07);animation:oilogo 1.6s cubic-bezier(.16,1,.3,1) .15s forwards,oisheen 1.7s cubic-bezier(.45,0,.2,1) 1.05s forwards}
@keyframes oilogo{to{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes oisheen{to{background-position:0 0}}
.oi-tap{position:absolute;inset:0;display:block;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.oi-tap:focus-visible{outline:2px solid #ffd9a0;outline-offset:-6px}
.oi-hint{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,241,233,.72);opacity:0;animation:oihintin .9s ease 2.4s forwards,oibreathe 2.4s ease-in-out 3.3s infinite}
@keyframes oihintin{to{opacity:1}}
@keyframes oibreathe{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.oi-logo,.oi-halo{animation-duration:.01ms}.oi-hint{animation:none;opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000">

  <sc-if value="{{showClip}}" hint-placeholder-val="{{ false }}">
    <video src="/_blob/dd135e02bacd649c60e3718638ab34ef" poster="/_blob/5e70e69aa015e34a5f1d35a94b0500da" autoPlay="{{ true }}" muted="{{ true }}" playsInline="{{ true }}" onEnded="{{toLogo}}" aria-label="A bulb lights up in an empty room" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></video>
  </sc-if>

  <sc-if value="{{showLogo}}" hint-placeholder-val="{{ false }}">
    <div class="oi-halo"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 300px; height: 160px; transform: translate(-50%, -50%)">
      <div class="oi-logo" role="img" aria-label="One Interiors"></div>
    </div>
    <a href="Start.dc.html" class="oi-tap" aria-label="Tap anywhere to continue">
      <span class="oi-hint">Tap anywhere to continue</span>
    </a>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'dark', run: 0 };
    this.timers = [];
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
  start() {
    this.clear();
    this.setState({ phase: 'dark' });
    this.timers.push(setTimeout(() => this.setState({ phase: 'clip' }), 1000));
    this.timers.push(setTimeout(() => this.toLogo(), 1000 + 4200));
  }
  toLogo() {
    if (this.state.phase !== 'clip') return;
    this.clear();
    this.setState({ phase: 'logo' });
  }
  renderVals() {
    const p = this.state.phase;
    return {
      showClip: p === 'clip',
      showLogo: p === 'logo',
      toLogo: () => this.toLogo(),
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>

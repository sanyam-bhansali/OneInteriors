/* motion and depth layer */

[role="radiogroup"] > *:nth-child(10),[role="group"] > *:nth-child(10),ol > li:nth-child(10),fieldset > div > *:nth-child(10),[role="tablist"] > *:nth-child(10){animation-delay:0.76s}

[role="progressbar"] > span:nth-child(4){animation-delay:0.20s}

/* coins */
@keyframes cPop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-26px)}}
@keyframes cSpin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes cShine{to{background-position:-200% 0}}
.coin{display:inline-block;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1C9 0%,#F2C98A 30%,#D9A23F 70%,#A8741E 100%);box-shadow:inset 0 0 0 1.5px rgba(122,82,20,.45),0 2px 6px -2px rgba(168,116,30,.6);position:relative}
.coin::after{content:"";position:absolute;inset:22%;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(122,82,20,.4)}
.coin.spin{animation:cSpin 2.4s cubic-bezier(.45,0,.2,1) .4s both}
.c-toast{position:absolute;left:50%;z-index:9;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 10px;border-radius:999px;background:#0B0B0B;color:#F2C98A;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 18px 36px -14px rgba(11,11,11,.7);animation:cPop 2.6s cubic-bezier(.22,1,.36,1) both}
.c-shine{background:linear-gradient(100deg,#F2C98A 0%,#FFF1C9 45%,#F2C98A 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:cShine 2.8s linear infinite}
@media (prefers-reduced-motion: reduce){.coin.spin,.c-toast,.c-shine{animation:none!important}.c-toast{opacity:1;transform:translate(-50%,0)}}

@keyframes msIn{0%{opacity:0;transform:translateY(40px) rotate(-4deg) scale(.9)}100%{opacity:1;transform:rotate(-2deg)}}
.ms{animation:msIn .9s cubic-bezier(.22,1,.36,1) .15s both}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}
.cf{position:absolute;left:50%;top:40%;width:8px;height:8px;border-radius:2px;opacity:0;animation:cf 1.6s cubic-bezier(.15,.8,.3,1) both}

a[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"],button[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"],a[style*="border-radius: 999px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"]{position:relative;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.22,1,.36,1),color .35s}

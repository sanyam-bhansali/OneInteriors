<style>
body{margin:0}
a{color:#0B0B0B}
a:focus-visible,button:focus-visible{outline:2px solid #BA5329;outline-offset:3px}

/* motion and depth layer */
@keyframes oiRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@keyframes oiGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

h1{animation:oiRise .8s cubic-bezier(.22,1,.36,1) both}
h1 ~ p,h1 + span{animation:oiRise .8s cubic-bezier(.22,1,.36,1) .12s both}
[role="radiogroup"] > *,[role="group"] > *,ol > li,fieldset > div > *,[role="tablist"] > *{animation:oiRise .7s cubic-bezier(.22,1,.36,1) both}

[role="radiogroup"] > *:nth-child(5),[role="group"] > *:nth-child(5),ol > li:nth-child(5),fieldset > div > *:nth-child(5),[role="tablist"] > *:nth-child(5){animation-delay:0.46s}
[role="radiogroup"] > *:nth-child(6),[role="group"] > *:nth-child(6),ol > li:nth-child(6),fieldset > div > *:nth-child(6),[role="tablist"] > *:nth-child(6){animation-delay:0.52s}
[role="radiogroup"] > *:nth-child(7),[role="group"] > *:nth-child(7),ol > li:nth-child(7),fieldset > div > *:nth-child(7),[role="tablist"] > *:nth-child(7){animation-delay:0.58s}
[role="radiogroup"] > *:nth-child(8),[role="group"] > *:nth-child(8),ol > li:nth-child(8),fieldset > div > *:nth-child(8),[role="tablist"] > *:nth-child(8){animation-delay:0.64s}
[role="radiogroup"] > *:nth-child(9),[role="group"] > *:nth-child(9),ol > li:nth-child(9),fieldset > div > *:nth-child(9),[role="tablist"] > *:nth-child(9){animation-delay:0.70s}
[role="radiogroup"] > *:nth-child(10),[role="group"] > *:nth-child(10),ol > li:nth-child(10),fieldset > div > *:nth-child(10),[role="tablist"] > *:nth-child(10){animation-delay:0.76s}
[role="radiogroup"] > *:nth-child(11),[role="group"] > *:nth-child(11),ol > li:nth-child(11),fieldset > div > *:nth-child(11),[role="tablist"] > *:nth-child(11){animation-delay:0.82s}
[role="radiogroup"] > *:nth-child(12),[role="group"] > *:nth-child(12),ol > li:nth-child(12),fieldset > div > *:nth-child(12),[role="tablist"] > *:nth-child(12){animation-delay:0.88s}
[role="progressbar"] > span{transform-origin:left center;animation:oiGrowX .9s cubic-bezier(.22,1,.36,1) both}
[role="progressbar"] > span:nth-child(1){animation-delay:0.05s}
[role="progressbar"] > span:nth-child(2){animation-delay:0.10s}
[role="progressbar"] > span:nth-child(3){animation-delay:0.15s}
[role="progressbar"] > span:nth-child(4){animation-delay:0.20s}
[role="progressbar"] > span:nth-child(5){animation-delay:0.25s}
[role="progressbar"] > span:nth-child(6){animation-delay:0.30s}
[role="progressbar"] > span:nth-child(7){animation-delay:0.35s}
img[style*="inset: 0"]{animation:oiKen 18s ease-in-out both alternate infinite}
a,button{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s ease,background-color .28s ease,color .28s ease}
a:active,button:active{transform:scale(.965)}
button[aria-pressed="true"],button[aria-checked="true"]{animation:oiPop .45s cubic-bezier(.34,1.56,.64,1)}
a[style*="background: rgb(11, 11, 11)"][style*="border-radius: 999px"],button[style*="background: rgb(11, 11, 11)"][style*="border-radius: 999px"]{box-shadow:0 14px 30px -16px rgba(11,11,11,.45)}
div[style*="background: rgb(11, 11, 11)"][style*="border-radius: 20px"],div[style*="background: rgb(11, 11, 11)"][style*="border-radius: 18px"],article[style*="background: rgb(11, 11, 11)"]{box-shadow:0 28px 56px -26px rgba(11,11,11,.6),inset 0 1px 0 rgba(255,255,255,.06)}
div[style*="background: rgb(186, 83, 41)"][style*="border-radius: 20px"]{box-shadow:0 28px 56px -22px rgba(186,83,41,.65),inset 0 1px 0 rgba(255,255,255,.18)}
img[style*="border-radius: 12px"],img[style*="border-radius: 16px"],img[style*="border-radius: 14px"]{box-shadow:0 14px 30px -18px rgba(11,11,11,.5)}
nav a[aria-current="page"] svg{animation:oiPop .7s cubic-bezier(.34,1.56,.64,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
[style*="overflow-y: auto"] > *{flex-shrink:0}

/* website skin (one-interiors home-cb.css) */
a[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"],button[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"],a[style*="border-radius: 999px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"]{position:relative;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.22,1,.36,1),color .35s}
a[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"]::before,button[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"]::before,a[style*="border-radius: 999px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"]::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:#C1582E;transform:translateY(101%);border-top-left-radius:50% 40%;border-top-right-radius:50% 40%;transition:transform .55s cubic-bezier(.22,1,.36,1),border-radius .55s cubic-bezier(.22,1,.36,1)}
a[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"]:hover::before,button[style*="border-radius: 999px"][style*="background: rgb(11, 11, 11)"]:hover::before,a[style*="border-radius: 999px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"]:hover::before{transform:none;border-radius:999px}
a[style*="border-radius: 999px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"]:hover{color:#FFFFFF!important}
a[style*="min-height: 56px"][style*="background: rgb(11, 11, 11)"] > svg:last-child,a[style*="min-height: 52px"][style*="background: rgb(11, 11, 11)"] > svg:last-child,a[style*="min-height: 46px"][style*="background: rgb(11, 11, 11)"] > svg:last-child,a[style*="min-height: 56px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"] > svg:last-child,a[style*="min-height: 46px"][style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"] > svg:last-child{width:28px;height:28px;padding:7px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;color:#0B0B0B;margin-right:-12px;flex-shrink:0}
a[style*="background: rgb(255, 255, 255); color: rgb(11, 11, 11)"] > svg:last-child{background:#0B0B0B!important;color:#FFFFFF!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #0B0B0B; font-family: 'Geist', sans-serif; overflow: hidden">

  <div style="flex-shrink: 0; padding: 20px 20px 0 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Q2.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B0B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: #5F5F5F">Question 3 of 7</span>
    </div>
    <div role="progressbar" aria-label="Question 3 of 7" aria-valuenow="3" aria-valuemin="1" aria-valuemax="7" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding-left: 8px">
      <span style="height: 3px; border-radius: 2px; background: #0B0B0B"></span><span style="height: 3px; border-radius: 2px; background: #0B0B0B"></span><span style="height: 3px; border-radius: 2px; background: #0B0B0B"></span><span style="height: 3px; border-radius: 2px; background: #E6E6E3"></span><span style="height: 3px; border-radius: 2px; background: #E6E6E3"></span><span style="height: 3px; border-radius: 2px; background: #E6E6E3"></span><span style="height: 3px; border-radius: 2px; background: #E6E6E3"></span>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -0.045em; line-height: .98">What are you planning to spend?</h1>
    <div role="radiogroup" aria-label="Budget tier" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="border: 0; border-radius: 18px; padding: 20px 18px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; background: {{t.bg}}; color: {{t.fg}}; box-shadow: inset 0 0 0 1px {{t.ring}}">
          <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
            <span style="font-size: 28px; font-weight: 500; letter-spacing: -0.04em">{{t.name}}</span>
            <span style="font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: {{t.tagColor}}">{{t.tag}}</span>
          </span>
          <span style="font-size: 15px; line-height: 1.45; color: {{t.sub}}">{{t.line}}</span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #5F5F5F">This sets the materials, not a fixed price. Your quotes show the exact figure for your flat.</p>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 36px">
    <a href="Q4.dc.html" style="min-height: 56px; border-radius: 999px; background: #0B0B0B; color: #FFFFFF; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none">Next
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 9h11M10 4.5 14.5 9 10 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'premium' };
  }
  renderVals() {
    const list = [
      { id: 'essential', name: 'Essential', tag: 'Good value', line: 'Everything you need, made well' },
      { id: 'premium', name: 'Premium', tag: 'Most chosen', line: 'Better materials where they are touched' },
      { id: 'luxury', name: 'Luxury', tag: 'Made to order', line: 'Made to your drawings, in the materials you chose' }
    ];
    return {
      tiers: list.map((t) => {
        const on = this.state.picked === t.id;
        return {
          ...t,
          checked: on ? 'true' : 'false',
          bg: on ? '#0B0B0B' : 'transparent',
          fg: on ? '#FFFFFF' : '#0B0B0B',
          sub: on ? '#C9C7C1' : '#5F5F5F',
          tagColor: on ? '#E07A4E' : '#5F5F5F',
          ring: on ? '#0B0B0B' : 'rgba(11,11,11,.18)',
          pick: () => this.setState({ picked: t.id })
        };
      })
    };
  }
}
</script>

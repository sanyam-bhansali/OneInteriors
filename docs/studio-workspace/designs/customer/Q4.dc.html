<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: [0, 1] };
  }
  renderVals() {
    const picked = this.state.picked;
    const toggle = (i) => {
      if (picked.indexOf(i) >= 0) this.setState({ picked: picked.filter((x) => x !== i) });
      else if (picked.length < 3) this.setState({ picked: picked.concat([i]) });
    };
    const out = { count: picked.length };
    for (let i = 0; i < 9; i++) {
      out['t' + i] = { pressed: picked.indexOf(i) >= 0 ? 'true' : 'false', pick: () => toggle(i) };
    }
    return out;
  }
}
</script>

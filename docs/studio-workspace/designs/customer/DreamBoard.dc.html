<style>
body{margin:0}
a{color:#0B0B0B}a:hover{color:#A6461F}

[style*="overflow-y: auto"] > *{flex-shrink:0}
/* motion and depth layer */
@keyframes oiRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes oiKen{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes oiGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes oiPop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
h1{animation:oiRise .8s cubic-bezier(.22,1,.36,1) both}
h1 ~ p,h1 + span{animation:oiRise .8s cubic-bezier(.22,1,.36,1) .12s both}
[role="radiogroup"] > *,[role="group"] > *,ol > li,fieldset > div > *,[role="tablist"] > *{animation:oiRise .7s cubic-bezier(.22,1,.36,1) both}
[role="radiogroup"] > *:nth-child(1),[role="group"] > *:nth-child(1),ol > li:nth-child(1),fieldset > div > *:nth-child(1),[role="tablist"] > *:nth-child(1){animation-delay:0.22s}

[role="radiogroup"] > *:nth-child(3),[role="group"] > *:nth-child(3),ol > li:nth-child(3),fieldset > div > *:nth-child(3),[role="tablist"] > *:nth-child(3){animation-delay:0.34s}
[role="radiogroup"] > *:nth-child(4),[role="group"] > *:nth-child(4),ol > li:nth-child(4),fieldset > div > *:nth-child(4),[role="tablist"] > *:nth-child(4){animation-delay:0.40s}
[role="radiogroup"] > *:nth-child(5),[role="group"] > *:nth-child(5),ol > li:nth-child(5),fieldset > div > *:nth-child(5),[role="tablist"] > *:nth-child(5){animation-delay:0.46s}
[role="radiogroup"] > *:nth-child(6),[role="group"] > *:nth-child(6),ol > li:nth-child(6),fieldset > div > *:nth-child(6),[role="tablist"] > *:nth-child(6){animation-delay:0.52s}
[role="radiogroup"] > *:nth-child(7),[role="group"] > *:nth-child(7),ol > li:nth-child(7),fieldset > div > *:nth-child(7),[role="tablist"] > *:nth-child(7){animation-delay:0.58s}
[role="radiogroup"] > *:nth-child(8),[role="group"] > *:nth-child(8),ol > li:nth-child(8),fieldset > div > *:nth-child(8),[role="tablist"] > *:nth-child(8){animation-delay:0.64s}
[role="radiogroup"] > *:nth-child(9),[role="group"] > *:nth-child(9),ol > li:nth-child(9),fieldset > div > *:nth-child(9),[role="tablist"] > *:nth-child(9){animation-delay:0.70s}
[role="radiogroup"] > *:nth-child(10),[role="group"] > *:nth-child(10),ol > li:nth-child(10),fieldset > div > *:nth-child(10),[role="tablist"] > *:nth-child(10){animation-delay:0.76s}

[role="progressbar"] > span:nth-child(1){animation-delay:0.05s}
[role="progressbar"] > span:nth-child(2){animation-delay:0.10s}
[role="progressbar"] > span:nth-child(3){animation-delay:0.15s}
[role="progressbar"] > span:nth-child(4){animation-delay:0.20s}
[role="progressbar"] > span:nth-child(5){animation-delay:0.25s}
[role="progressbar"] > span:nth-child(6){animation-delay:0.30s}
[role="progressbar"] > span:nth-child(7){animation-delay:0.35s}

a:active,button:active{transform:scale(.965)}

/* coins */
@keyframes cPop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-26px)}}
@keyframes cSpin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes cShine{to{background-position:-200% 0}}
.coin{display:inline-block;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1C9 0%,#F2C98A 30%,#D9A23F 70%,#A8741E 100%);box-shadow:inset 0 0 0 1.5px rgba(122,82,20,.45),0 2px 6px -2px rgba(168,116,30,.6);position:relative}
.coin::after{content:"";position:absolute;inset:22%;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(122,82,20,.4)}
.coin.spin{animation:cSpin 2.4s cubic-bezier(.45,0,.2,1) .4s both}
.c-toast{position:absolute;left:50%;z-index:9;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 10px;border-radius:999px;background:#0B0B0B;color:#F2C98A;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 18px 36px -14px rgba(11,11,11,.7);animation:cPop 2.6s cubic-bezier(.22,1,.36,1) both}
.c-shine{background:linear-gradient(100deg,#F2C98A 0%,#FFF1C9 45%,#F2C98A 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:cShine 2.8s linear infinite}
@media (prefers-reduced-motion: reduce){.coin.spin,.c-toast,.c-shine{animation:none!important}.c-toast{opacity:1;transform:translate(-50%,0)}}

/* bottom bar */
@keyframes gBreathe{50%{transform:scale(1.07)}}
@keyframes gSpin{to{transform:rotate(360deg)}}
.oi-tab{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;text-decoration:none;color:#A9A7A1!important;font-size:13px;font-weight:500}
.oi-tab[aria-current="page"]{color:#E07A4E!important;font-weight:600}
.oi-geio{position:relative;width:52px;height:52px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFF6E6 0%,#F2C98A 26%,#E07A4E 56%,#BA5329 80%,#6E2A10 100%);box-shadow:0 0 0 5px #0B0B0B,0 0 26px -2px rgba(242,201,138,.75);animation:gBreathe 4.2s ease-in-out infinite}
.oi-geio::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 28%,rgba(255,248,236,.6) 40%,transparent 54%);mix-blend-mode:screen;animation:gSpin 5.5s linear infinite}
@media (prefers-reduced-motion: reduce){.oi-geio,.oi-geio::after{animation:none!important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: true, shared: false }; }
  renderVals() {
    const p = this.state.playing;
    return {
      playing: p, paused: !p, pc: p ? '' : 'paused', playLabel: p ? 'Pause' : 'Play',
      toggle: () => this.setState({ playing: !p }),
      shared: this.state.shared,
      share: () => this.setState({ shared: false }, () => setTimeout(() => this.setState({ shared: true }), 20))
    };
  }
}
</script>

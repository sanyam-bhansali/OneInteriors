name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which loads prisma.config.ts →
      # prisma/load-env.ts, and that exits when DATABASE_URL is unset. Generate
      # never connects, so a placeholder is enough — and it is set on this step
      # only, so the build below still runs in fixtures mode. Without it every
      # run since 7 Sep died here, before a single check ran.
      - name: Install
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Money and matching logic have unit tests. A failing test here is not a
      # style nit — it means a rate, a split, or a match score is wrong.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
